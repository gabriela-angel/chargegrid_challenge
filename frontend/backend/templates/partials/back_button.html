{# Botão "Voltar" do app do cliente — canto superior ESQUERDO do cartão, na
   mesma linha do logo e oposto ao botão de tema (claro/escuro). Usar dentro
   de <div class="cliente-brand-row">. #}
{% macro back_button(href, label="Voltar") -%}
<a class="cliente-back" href="{{ href }}" aria-label="{{ label }}">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg>
  <span>{{ label }}</span>
</a>
{%- endmacro %}
