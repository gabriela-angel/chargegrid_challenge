<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChargeGrid — Cadastro</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script>(function(){try{var t=localStorage.getItem("cg-theme");if(t==="light"||t==="dark"){document.documentElement.setAttribute("data-theme",t);}}catch(e){}})();</script>
</head>
<body class="cliente-screen">

  {% from "partials/icons.html" import icon %}

  <main class="cliente-card">
    <div class="cliente-brand-row">
      <div class="cliente-brand">{{ icon("zap", filled=True) }}<span>ChargeGrid</span></div>
      {% include "partials/theme_toggle.html" %}
    </div>
    <h1>Criar conta</h1>

    {% if error %}<div class="field-error">{{ error }}</div>{% endif %}

    <form method="post" action="/cliente/cadastro" class="auth-form">
      <div class="form-field">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" required value="{{ form.nome }}" autofocus>
      </div>
      <div class="form-field">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" required value="{{ form.cpf }}" placeholder="Somente números" inputmode="numeric">
      </div>
      <div class="form-field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required value="{{ form.email }}">
      </div>
      <div class="form-field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" required>
      </div>
      <div class="form-field">
        <label for="confirmar_senha">Confirmar senha</label>
        <input type="password" id="confirmar_senha" name="confirmar_senha" required>
      </div>
      <button type="submit" class="primary">Criar conta</button>
    </form>

    <div class="link-row">Já tem conta? <a href="/cliente/login">Entrar</a></div>
  </main>

</body>
</html>
